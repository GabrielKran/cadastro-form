<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="layout">
        
        <div class="img-main">
            <img src="img/Mobile login-pana.svg" alt="Sign up">
            <p>Cadastre-se e receba as novidades em primeira mão</p>
            <a href="https://storyset.com/phone" target="_blank">Phone illustrations by Storyset</a>
        </div>
        

        <div class="content-main">

            <h1>Cadastre-se</h1>

            <form action="" method="post">

                <div class="form-item">
                    <input type="text" name="primeiroNome" required id="primeiroNome">
                    <label for="primeiroNome">primeiro nome</label>
                </div>
            
                <div class="form-item right-item">
                    <input type="text" name="sobrenome" required id="sobrenome">
                    <label for="sobrenome">sobrenome</label>
                </div>
            
                <div class="form-item">
                    <input type="email" name="email" required id="email">
                    <label for="email">email</label>
                </div>
            
                <div class="form-item right-item">
                    <input type="tel" name="telefone" required id="telefone">
                    <label for="telefone">telefone</label>
                </div>
            
                <div class="form-item">
                    <input type="password" name="senha" required id="senha">
                    <label for="senha">senha</label>
                </div>
            
                <div class="form-item right-item">
                    <input type="password" name="repetirsenha" required id="repetirsenha">
                    <label for="repetirsenha">confirme sua senha</label>
                </div>
            
                <div class="form-button">
                    <button type="submit">Criar uma conta</button>
                    <p>Já tem uma conta? <span>Entrar</span></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
